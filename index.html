```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;

            background:
                radial-gradient(circle at 20% 20%, #7c3aed 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #06b6d4 0%, transparent 35%),
                linear-gradient(135deg, #020617, #0f172a, #111827);

            position: relative;
        }

        /* Animated background */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.25);
            filter: blur(80px);
            animation: moveGlow 8s infinite alternate ease-in-out;
        }

        @keyframes moveGlow {
            from {
                transform: translate(-250px, -150px);
            }
            to {
                transform: translate(250px, 150px);
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 8s infinite ease-in-out;
        }

        .p1 { left: 10%; top: 20%; animation-delay: 0s; }
        .p2 { left: 20%; top: 70%; animation-delay: 2s; }
        .p3 { left: 75%; top: 15%; animation-delay: 1s; }
        .p4 { left: 90%; top: 60%; animation-delay: 3s; }
        .p5 { left: 55%; top: 85%; animation-delay: 4s; }
        .p6 { left: 40%; top: 10%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-40px) scale(1.5);
            }
        }

        /* Main card */
        .welcome-card {
            width: min(90%, 800px);
            padding: 70px 50px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);

            position: relative;
            z-index: 2;

            animation: cardAppear 1s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Small badge */
        .badge {
            display: inline-block;
            padding: 8px 18px;
            margin-bottom: 25px;

            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);

            color: #c4b5fd;
            font-size: 14px;
            font-weight: 500;

            animation: fadeIn 1.5s ease;
        }

        /* Heading */
        h1 {
            font-size: clamp(45px, 8vw, 85px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -3px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #c4b5fd,
                #67e8f9,
                #ffffff
            );

            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation:
                gradientText 5s infinite linear,
                fadeIn 1s ease;
        }

        @keyframes gradientText {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        .subtitle {
            margin-top: 25px;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;

            animation: fadeIn 1.5s ease;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-top: 35px;
            padding: 15px 32px;

            border: none;
            border-radius: 50px;

            color: white;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );

            box-shadow:
                0 10px 30px rgba(124, 58, 237, 0.35);

            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.03);

            box-shadow:
                0 15px 40px rgba(6, 182, 212, 0.4);
        }

        .btn span {
            transition: transform 0.3s ease;
        }

        .btn:hover span {
            transform: translateX(5px);
        }

        /* Bottom text */
        .footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {

            .welcome-card {
                padding: 50px 25px;
                border-radius: 25px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .subtitle {
                font-size: 15px;
            }

            .btn {
                padding: 13px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating particles -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>

    <!-- Welcome Card -->
    <main class="welcome-card">

        <div class="badge">
            ✨ Welcome to the Future
        </div>

        <h1>
            Welcome!
        </h1>

        <p class="subtitle">
            We're glad you're here.
            Explore, discover and experience something amazing.
            Your journey starts right here.
        </p>

        <a href="#" class="btn" onclick="startJourney(event)">
            Get Started
            <span>→</span>
        </a>

        <div class="footer">
            Made with ❤️ using HTML & CSS
        </div>

    </main>

    <script>
        function startJourney(event) {
            event.preventDefault();

            alert("🚀 Welcome! Your journey begins now.");
        }
    </script>

</body>
</html>
```
